<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Du hành vũ trụ</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <div id="start-screen" class="overlay">
            <i class="fa-solid fa-shuttle-space cosmic-icon"></i>
            <h1 class="title">Du hành vũ trụ</h1>
            <input type="text" id="player-name" placeholder="Tên phi hành gia..." maxlength="15">
            <button id="start-btn">BẮT ĐẦU NHIỆM VỤ</button>
        </div>

        <div id="end-screen" class="overlay hidden">
            <h2 class="result-title">MISSION FAILED</h2>
            <p id="final-score">Điểm: 0</p>
            <div id="leaderboard-mini">
                <h3>TOP PHI HÀNH GIA</h3>
                <ul id="leaderboard-list"><li>Đang tải...</li></ul>
            </div>
            <button onclick="location.reload()" class="retry-btn">THỬ LẠI</button>
        </div>

        <div id="game-ui" class="hidden">
            <div class="score-tag">SCORE: <span id="score">0</span></div>
        </div>

        <canvas id="birdGame" width="320" height="480"></canvas>
    </div>

    <script src="game.js"></script>
</body>
</html>
