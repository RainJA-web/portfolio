<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Music Player - Lyric & Google Sheets</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #121212; color: white; display: flex; justify-content: center; padding: 20px; margin: 0; }
        .container { width: 450px; background: #1e1e1e; padding: 25px; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.6); }
        
        /* Player & Info */
        #youtube-iframe { display: none; }
        .audio-info { text-align: center; margin-bottom: 20px; }
        .cover-art { width: 150px; height: 150px; border-radius: 50%; object-fit: cover; border: 4px solid #1db954; margin-bottom: 10px; transition: 0.5s; }
        
        /* Lyric Section */
        .lyric-container { 
            height: 120px; overflow-y: auto; text-align: center; 
            margin: 15px 0; padding: 10px; background: rgba(255,255,255,0.05);
            border-radius: 10px; font-style: italic; color: #1db954; line-height: 1.6;
        }
        .lyric-text { white-space: pre-wrap; font-size: 14px; color: #ccc; }

        /* Playlist */
        .playlist { max-height: 200px; overflow-y: auto; border-top: 1px solid #333; margin-top: 15px; }
        .song-item { display: flex; align-items: center; padding: 10px; cursor: pointer; border-radius: 8px; margin-top: 5px; }
        .song-item:hover { background: #333; }
        .song-item.active { background: #1db95422; border: 1px solid #1db954; }
        .song-item img { width: 40px; height: 40px; border-radius: 4px; margin-right: 12px; }
        .song-details h4 { margin: 0; font-size: 14px; }
        .song-details p { margin: 0; font-size: 11px; color: #b3b3b3; }
        
        /* Tùy chỉnh thanh cuộn */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
    </style>
</head>
<body>

<div class="container">
    <iframe id="youtube-iframe" src="" allow="autoplay"></iframe>

    <div class="audio-info">
        <img id="current-cover" class="cover-art" src="https://via.placeholder.com/150" alt="Cover">
        <h2 id="current-title" style="margin: 10px 0 5px 0; font-size: 20px;">Đang tải...</h2>
        <p id="current-artist" style="margin: 0; color: #1db954; font-weight: bold;"></p>
    </div>

    <div class="lyric-container">
        <div id="lyric-display" class="lyric-text">Lời bài hát sẽ hiển thị tại đây...</div>
    </div>

    <div class="playlist" id="playlist-container"></div>
</div>

<script>
    const SHEET_URL = 'https://docs.google.com/spreadsheets/d/19rqJdnmV1fH4QhrrNCrTOZEKBZuXoXbYLXGwIERwy-o/gviz/tq?tqx=out:csv&sheet=Playlisst';
    let songs = [];

    async function fetchSongs() {
        try {
            const response = await fetch(SHEET_URL);
            const data = await response.text();
            
            // Xử lý CSV phức tạp hơn để tránh lỗi dấu phẩy trong Lyric
            const rows = data.split('\n').slice(1); 
            songs = rows.map(row => {
                // Regex để tách CSV chuẩn (giữ nguyên dữ liệu trong ngoặc kép)
                const cols = row.match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g) || [];
                const cleanCols = cols.map(c => c.replace(/^"|"$/g, ''));

                return {
                    title: cleanCols[0] || "No Title",
                    artist: cleanCols[1] || "Unknown",
                    cover: cleanCols[2] || "",
                    id: extractID(cleanCols[3] || ""),
                    category: cleanCols[4] || "",
                    lyric: cleanCols[5] || "Dữ liệu lời bài hát đang được cập nhật..."
                };
            }).filter(s => s.title !== "No Title");

            renderPlaylist();
            if(songs.length > 0) updateUI(0);
        } catch (error) {
            console.error("Lỗi:", error);
            document.getElementById('current-title').innerText = "Lỗi kết nối trang tính";
        }
    }

    function extractID(input) {
        if (input.includes('embed/')) return input.split('embed/')[1].split('?')[0];
        if (input.includes('v=')) return input.split('v=')[1].split('&')[0];
        return input;
    }

    function renderPlaylist() {
        const container = document.getElementById('playlist-container');
        container.innerHTML = '';
        songs.forEach((song, index) => {
            const item = document.createElement('div');
            item.className = 'song-item';
            item.innerHTML = `
                <img src="${song.cover}">
                <div class="song-details">
                    <h4>${song.title}</h4>
                    <p>${song.artist}</p>
                </div>
            `;
            item.onclick = () => playSong(index);
            container.appendChild(item);
        });
    }

    function playSong(index) {
        const song = songs[index];
        const iframe = document.getElementById('youtube-iframe');
        iframe.src = `https://www.youtube.com/embed/${song.id}?autoplay=1`;
        
        updateUI(index);
        
        document.querySelectorAll('.song-item').forEach((el, i) => {
            el.classList.toggle('active', i === index);
        });
    }

    function updateUI(index) {
        const song = songs[index];
        document.getElementById('current-title').innerText = song.title;
        document.getElementById('current-artist').innerText = song.artist;
        document.getElementById('current-cover').src = song.cover;
        
        // Hiển thị Lyric
        const lyricDisplay = document.getElementById('lyric-display');
        lyricDisplay.innerText = song.lyric;
        lyricDisplay.parentElement.scrollTop = 0; // Cuộn lyric lên đầu bài
    }

    fetchSongs();
</script>

</body>
</html>
