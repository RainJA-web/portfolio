<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Zone - Phan Minh Thuan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap');
        body { background: #020617; font-family: 'Plus Jakarta Sans', sans-serif; color: #e2e8f0; }
        .glass-card { background: rgba(30, 41, 59, 0.4); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.05); }
        
        /* Light Mode Support */
        body.light-mode { background: #f0f9ff; color: #1e293b; }
        body.light-mode .glass-card { background: rgba(255, 255, 255, 0.75); border-color: rgba(0,0,0,0.1); box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
        body.light-mode .text-white { color: #0f172a !important; }
        body.light-mode .text-blue-300 { color: #0369a1 !important; }
        body.light-mode .bg-slate-950\/80 { background: rgba(255,255,255,0.9) !important; }
        body.light-mode .border-white\/10 { border-color: rgba(0,0,0,0.1) !important; }

        /* Season Effects */
        #season-effect { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
        .particle { position: absolute; top: -20px; animation: fall linear forwards; opacity: 0.8; }
        @keyframes fall { to { transform: translateY(105vh) rotate(720deg); } }

        /* Season Themes */
        body.season-spring { background: linear-gradient(to bottom right, #1a0510, #020617); }
        body.season-summer { background: linear-gradient(to bottom right, #0f172a, #0c4a6e); }
        body.season-autumn { background: linear-gradient(to bottom right, #1f0f05, #020617); }
        body.season-winter { background: linear-gradient(to bottom right, #0b1120, #1e293b); }
        body.light-mode.season-spring { background: linear-gradient(to bottom right, #fff1f2, #f0f9ff); }
        body.light-mode.season-autumn { background: linear-gradient(to bottom right, #fff7ed, #f0f9ff); }

        /* Fullscreen Mode Styles */
        .glass-card:fullscreen {
            background: #020617;
            border-radius: 0 !important;
            border: none !important;
            width: 100vw;
            height: 100vh;
        }
        .glass-card:fullscreen .bg-slate-950\/80 {
            background: #0f172a;
        }
    </style>
</head>
<body class="min-h-screen">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 md:py-12">
        <div id="app-header"></div>

        <main id="page-content" class="flex flex-col h-[90vh]">
            <div class="mb-4 shrink-0">
                <a href="index.html" class="inline-flex items-center text-slate-400 hover:text-white transition-colors mb-2">
                    <i class="fa-solid fa-arrow-left mr-2"></i> Quay lại
                </a>
                <h2 class="text-2xl font-bold text-white flex items-center gap-3">
                    <i class="fa-solid fa-gamepad text-orange-400"></i> Game Center
                </h2>
            </div>

            <div class="flex flex-col lg:flex-row gap-6 flex-1 min-h-0">
                <div id="game-container" class="glass-card rounded-2xl overflow-hidden border border-orange-500/30 shadow-[0_0_30px_rgba(249,115,22,0.1)] flex-1 flex flex-col min-h-0">
                    <div class="bg-slate-950/80 p-4 flex justify-between items-center border-b border-white/10 shrink-0">
                        <div class="flex items-center space-x-3">
                            <span class="w-3 h-3 rounded-full bg-red-500/80"></span>
                            <span class="w-3 h-3 rounded-full bg-yellow-500/80"></span>
                            <span class="w-3 h-3 rounded-full bg-green-500/80"></span>
                            <span id="game-title" class="ml-4 font-mono text-sm text-blue-300 tracking-wider">LOADING...</span>
                        </div>
                        <div class="flex gap-2">
                            <button onclick="document.getElementById('game-frame').contentWindow.location.reload()" class="text-gray-500 hover:text-white transition-colors px-2" title="Reload">
                                <i class="fa-solid fa-rotate-right"></i>
                            </button>
                            <button onclick="toggleFullscreen()" class="text-gray-500 hover:text-white transition-colors px-2" title="Fullscreen">
                                <i class="fa-solid fa-expand"></i>
                            </button>
                        </div>
                    </div>
                    <div class="relative flex-1 bg-[#020617] flex items-center justify-center overflow-hidden">
                        <iframe id="game-frame" class="w-full h-full border-0"></iframe>
                        <div id="loading-overlay" class="absolute inset-0 flex flex-col items-center justify-center bg-slate-900 z-10">
                            <div class="animate-spin rounded-full h-16 w-16 border-t-2 border-b-2 border-orange-500 mb-6"></div>
                            <h3 class="text-xl font-bold text-white">Initializing Game Environment...</h3>
                        </div>
                    </div>
                </div>

                <!-- Right Column: Details & Instructions -->
                <div class="w-full lg:w-96 glass-card rounded-2xl p-6 flex flex-col shrink-0 h-fit max-h-full border border-white/10">
                    <h3 class="text-xl font-bold text-white mb-4 border-b border-white/10 pb-3 flex items-center gap-2">
                        <i class="fa-solid fa-circle-info text-blue-400"></i> Thông tin
                    </h3>
                    <div id="info-content" class="overflow-y-auto flex-1 text-slate-300 text-sm space-y-4 pr-2">
                        <div class="animate-pulse space-y-3">
                            <div class="h-4 bg-slate-700 rounded w-3/4"></div>
                            <div class="h-4 bg-slate-700 rounded w-1/2"></div>
                            <div class="h-20 bg-slate-700 rounded w-full"></div>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <div id="app-footer"></div>
    </div>

    <script src="layout.js"></script>
    <script>
        function toggleFullscreen() {
            const elem = document.getElementById('game-container');
            if (!document.fullscreenElement) elem.requestFullscreen().catch(err => alert(`Error: ${err.message}`));
            else document.exitFullscreen();
        }

        document.addEventListener('fullscreenchange', () => {
            const icon = document.querySelector('button[title="Fullscreen"] i');
            if (document.fullscreenElement) {
                icon.classList.replace('fa-expand', 'fa-compress');
            } else {
                icon.classList.replace('fa-compress', 'fa-expand');
            }
        });

        (async () => {
            const params = new URLSearchParams(window.location.search);
            const id = params.get('id');
            const titleEl = document.getElementById('game-title');
            const iframe = document.getElementById('game-frame');
            const loading = document.getElementById('loading-overlay');

            if (!id) {
                loading.innerHTML = '<p class="text-red-500">Game ID not found!</p>';
                return;
            }

            try {
                const sheetURL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vST_-LBCQA1S0xPQRMgxaPCb0lDSJdEA9RRmoi88cajq-LHV-b9ErpKlNWUecgL95hcK_rdoIFs7DFh/pub?output=csv';
                const response = await fetch(sheetURL);
                const data = await response.text();
                const rows = data.split('\n').slice(1);
                
                const game = rows.map(row => {
                    const cols = row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(c => c.replace(/^"|"$/g, '').trim());
                    return { id: cols[0], title: cols[1], url: cols[6] };
                }).find(g => g.id === id);

                if (game) {
                    titleEl.innerText = game.title.toUpperCase();
                    document.title = `${game.title} - Game Center`;
                    if (game.url) {
                        iframe.src = game.url;
                        iframe.onload = () => loading.classList.add('hidden');
                    } else {
                        loading.innerHTML = '<p class="text-red-500">Game URL empty!</p>';
                    }
                } else {
                    loading.innerHTML = '<p class="text-red-500">Game not found!</p>';
                    titleEl.innerText = 'NOT FOUND';
                }

                // Fetch Details from new sheet
                const detailsURL = 'https://docs.google.com/spreadsheets/d/19rqJdnmV1fH4QhrrNCrTOZEKBZuXoXbYLXGwIERwy-o/gviz/tq?tqx=out:csv&gid=978953027';
                fetch(detailsURL).then(r => r.text()).then(d => {
                    const rows = d.split('\n').slice(1);
                    const details = rows.map(row => {
                        const cols = row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(c => c.replace(/^"|"$/g, '').trim());
                        return { id: cols[0], title: cols[1], desc: cols[2], instruct: cols[3] };
                    }).find(i => i.id === id);
                    
                    const infoContent = document.getElementById('info-content');
                    if (details) {
                        infoContent.innerHTML = `
                            <div class="mb-4">
                                <h4 class="font-bold text-white mb-1">Mô tả</h4>
                                <p>${details.desc || 'Chưa có mô tả.'}</p>
                            </div>
                            <div>
                                <h4 class="font-bold text-white mb-1">Hướng dẫn chơi</h4>
                                <p class="whitespace-pre-line">${details.instruct || 'Chưa có hướng dẫn.'}</p>
                            </div>
                        `;
                    } else {
                        infoContent.innerHTML = '<p class="text-slate-500 italic">Không có thông tin chi tiết cho game này.</p>';
                    }
                }).catch(err => {
                    console.error(err);
                    document.getElementById('info-content').innerHTML = '<p class="text-red-400">Lỗi tải thông tin.</p>';
                });
            } catch (e) {
                console.error(e);
                loading.innerHTML = '<p class="text-red-500">Error loading data!</p>';
            }
        })();
    </script>
</body>
</html>
