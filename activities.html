<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activities - Phan Minh Thuan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap');
        body { background: #020617; font-family: 'Plus Jakarta Sans', sans-serif; color: #e2e8f0; }
        .glass-card { background: rgba(30, 41, 59, 0.4); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.05); }
        
        /* Light Mode Support */
        body.light-mode { background: #f0f9ff; color: #1e293b; }
        body.light-mode .glass-card { background: rgba(255, 255, 255, 0.75); border-color: rgba(0,0,0,0.1); box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
        body.light-mode .text-white { color: #0f172a !important; }
        body.light-mode .text-slate-400 { color: #64748b !important; }
        body.light-mode .bg-slate-900 { background: #e2e8f0 !important; }
        body.light-mode .border-slate-700 { border-color: #cbd5e1 !important; }
        body.light-mode .hover\:text-white:hover { color: #020617 !important; }

        /* Season Effects */
        #season-effect { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
        .particle { position: absolute; top: -20px; animation: fall linear forwards; opacity: 0.8; }
        @keyframes fall { to { transform: translateY(105vh) rotate(720deg); } }

        /* Season Themes */
        body.season-spring { background: linear-gradient(to bottom right, #1a0510, #020617); }
        body.season-summer { background: linear-gradient(to bottom right, #0f172a, #0c4a6e); }
        body.season-autumn { background: linear-gradient(to bottom right, #1f0f05, #020617); }
        body.season-winter { background: linear-gradient(to bottom right, #0b1120, #1e293b); }
        body.light-mode.season-spring { background: linear-gradient(to bottom right, #fff1f2, #f0f9ff); }
        body.light-mode.season-autumn { background: linear-gradient(to bottom right, #fff7ed, #f0f9ff); }

        /* Timeline SVG & Curve Logic */
        .timeline-svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
        .timeline-path { fill: none; stroke: rgba(255,255,255,0.1); stroke-width: 3; stroke-linecap: round; }
        .timeline-path-active { fill: none; stroke: #3b82f6; stroke-width: 3; stroke-linecap: round; filter: drop-shadow(0 0 10px #3b82f6); transition: stroke-dashoffset 0.1s linear; }
        body.light-mode .timeline-path { stroke: rgba(0,0,0,0.1); }
        body.light-mode .timeline-path-active { stroke: #0ea5e9; filter: drop-shadow(0 0 10px #0ea5e9); }

        /* Zig-Zag Offset for Desktop to create Curve */
        @media (min-width: 768px) {
            .timeline-item:nth-child(even) .timeline-icon { margin-left: -50px; }
            .timeline-item:nth-child(odd) .timeline-icon { margin-left: 50px; }
        }

        .timeline-item.active .timeline-icon {
            background: #3b82f6; border-color: #93c5fd;
            box-shadow: 0 0 25px rgba(59, 130, 246, 1);
            transform: translate(-50%, 0) scale(1.2);
        }
        .timeline-item.active .timeline-icon i { color: white; }
        .timeline-item.active .glass-card {
            border-color: rgba(59, 130, 246, 0.5);
            box-shadow: 0 0 30px rgba(59, 130, 246, 0.15);
        }

        /* Filter Inputs */
        .filter-input {
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
        }
        
        .animate-fade-in { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="min-h-screen">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 md:py-12">
        <div id="app-header"></div>

        <main id="page-content">
            <div class="mb-12 text-center">
                <h2 class="text-3xl font-bold text-white mb-4 flex items-center justify-center gap-3">
                    <i class="fa-solid fa-camera-retro text-blue-400"></i> Hoạt động & Sự kiện
                </h2>
                <p class="text-slate-400">Những khoảnh khắc đáng nhớ và cột mốc quan trọng.</p>
            </div>

            <!-- Filter Bar -->
            <div class="glass-card p-4 rounded-xl mb-8 shadow-lg backdrop-blur-xl border-blue-500/20 transition-all duration-300">
                <div class="flex flex-col md:flex-row gap-4 items-center justify-between">
                    <div class="relative w-full md:w-96 group">
                        <i class="fa-solid fa-search absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 group-focus-within:text-blue-400 transition-colors"></i>
                        <input type="text" id="search-input" oninput="applyFilters()" placeholder="Tìm kiếm sự kiện..." class="filter-input w-full pl-10 pr-10 py-2.5 rounded-lg focus:outline-none focus:border-blue-500 transition-all bg-slate-800/50 border-white/10 text-sm">
                        <button onclick="clearSearch()" id="clear-search-btn" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-white hidden transition-colors"><i class="fa-solid fa-xmark"></i></button>
                    </div>
                    <div class="flex gap-3 w-full md:w-auto">
                        <select id="year-filter" onchange="applyFilters()" class="filter-input px-4 py-2.5 rounded-lg focus:outline-none focus:border-blue-500 cursor-pointer flex-1 md:flex-none text-sm bg-slate-800/50 border-white/10"></select>
                        <button onclick="toggleSort()" id="sort-btn" class="filter-input px-4 py-2.5 rounded-lg hover:bg-blue-500/20 hover:text-blue-400 transition-all font-medium flex items-center gap-2 whitespace-nowrap text-sm bg-slate-800/50 border-white/10"><i class="fa-solid fa-arrow-down-wide-short"></i> Mới nhất</button>
                    </div>
                </div>
                
                <!-- Result Count -->
                <div id="filter-status" class="hidden mt-3 pt-3 border-t border-white/10 text-xs text-slate-400 justify-between items-center animate-fade-in">
                    <span>Tìm thấy <b id="result-count" class="text-white">0</b> kết quả</span>
                    <button onclick="resetFilters()" class="text-blue-400 hover:text-blue-300 hover:underline">Xóa bộ lọc</button>
                </div>
            </div>

            <div class="relative py-8" id="timeline-container">
                <!-- SVG Curved Line -->
                <svg class="timeline-svg">
                    <path class="timeline-path" id="base-path"></path>
                    <path class="timeline-path-active" id="active-path"></path>
                </svg>
                
                <!-- Content will be injected here -->
                <div id="loading-indicator" class="text-center py-12">
                    <div class="animate-spin w-8 h-8 border-4 border-blue-500 border-t-transparent rounded-full mx-auto mb-4"></div>
                    <p class="text-slate-400">Đang tải dữ liệu hoạt động...</p>
                </div>
            </div>
        </main>

        <div id="app-footer"></div>
    </div>

    <script src="layout.js"></script>
    <script>
    {
        const SHEET_ID = '19rqJdnmV1fH4QhrrNCrTOZEKBZuXoXbYLXGwIERwy-o';
        const GID = '460370999';
        const ACTIVITIES_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&gid=${GID}`;
        
        // Cleanup previous listeners (SPA support)
        if (window.activitiesCleanup) window.activitiesCleanup();

        let pathLength = 0;
        let allActivities = [];
        let isDesc = true; // Mặc định mới nhất trước

        async function fetchActivities() {
            try {
                const response = await fetch(ACTIVITIES_URL);
                const data = await response.text();
                const rows = data.split('\n').slice(1);
                
                allActivities = rows.map(row => {
                    const cols = row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(c => c.replace(/^"|"$/g, '').trim());
                    if (cols.length < 2) return null;
                    return {
                        date: cols[0],
                        title: cols[1],
                        desc: cols[2],
                        image: cols[3],
                        icon: cols[4] || 'fa-star'
                    };
                }).filter(a => a);

                populateYears();
                applyFilters();
                initScrollSpy();
            } catch (error) {
                console.error("Lỗi tải hoạt động:", error);
                document.getElementById('loading-indicator').innerHTML = '<p class="text-red-400">Không thể tải dữ liệu.</p>';
            }
        }

        function populateYears() {
            const years = [...new Set(allActivities.map(a => {
                const match = a.date.match(/\d{4}/);
                return match ? match[0] : 'Khác';
            }))].sort().reverse();
            
            const select = document.getElementById('year-filter');
            select.innerHTML = '<option value="all">Tất cả thời gian</option>' + 
                years.map(y => `<option value="${y}">Năm ${y}</option>`).join('');
        }

        window.toggleSort = () => {
            isDesc = !isDesc;
            const btn = document.getElementById('sort-btn');
            btn.innerHTML = isDesc ? 
                '<i class="fa-solid fa-arrow-down-wide-short"></i> Mới nhất' : 
                '<i class="fa-solid fa-arrow-up-wide-short"></i> Cũ nhất';
            applyFilters();
        }

        window.applyFilters = () => {
            const searchInput = document.getElementById('search-input');
            const search = searchInput.value.toLowerCase();
            const year = document.getElementById('year-filter').value;
            const clearBtn = document.getElementById('clear-search-btn');
            const filterStatus = document.getElementById('filter-status');
            
            // Toggle clear button
            if (search.length > 0) clearBtn.classList.remove('hidden');
            else clearBtn.classList.add('hidden');
            
            let filtered = allActivities.filter(item => {
                const matchSearch = item.title.toLowerCase().includes(search) || item.desc.toLowerCase().includes(search);
                const matchYear = year === 'all' || item.date.includes(year);
                return matchSearch && matchYear;
            });

            if (!isDesc) {
                filtered.reverse();
            }

            // Update result count UI
            document.getElementById('result-count').innerText = filtered.length;
            if (search !== '' || year !== 'all') {
                filterStatus.classList.remove('hidden');
                filterStatus.classList.add('flex');
            } else {
                filterStatus.classList.add('hidden');
                filterStatus.classList.remove('flex');
            }

            renderTimeline(filtered);
        }

        window.clearSearch = () => {
            document.getElementById('search-input').value = '';
            applyFilters();
        }

        window.resetFilters = () => {
            document.getElementById('search-input').value = '';
            document.getElementById('year-filter').value = 'all';
            applyFilters();
        }

        function renderTimeline(items) {
            const container = document.getElementById('timeline-container');
            const loading = document.getElementById('loading-indicator');
            if(loading) loading.remove();

            // Xóa nội dung cũ (giữ lại SVG)
            const oldItems = container.querySelectorAll('.timeline-item');
            oldItems.forEach(el => el.remove());

            if (items.length === 0) {
                container.insertAdjacentHTML('beforeend', '<div class="timeline-item text-center text-slate-500 py-10 w-full">Không tìm thấy hoạt động nào phù hợp.</div>');
                drawTimeline();
                return;
            }

            items.forEach((item, index) => {
                const isEven = index % 2 === 0;
                // Mobile: Luôn hiển thị bên phải line (line dời sang trái)
                // Desktop: So le (Even: Text Left - Img Right, Odd: Img Left - Text Right)
                
                const html = `
                <div class="timeline-item relative mb-12 md:mb-24 flex flex-col md:flex-row items-center justify-between w-full group">
                    <!-- Icon Center -->
                    <div class="timeline-icon absolute left-[20px] md:left-1/2 transform -translate-x-1/2 w-10 h-10 rounded-full bg-slate-900 border-4 border-blue-500/30 flex items-center justify-center z-10 shadow-[0_0_15px_rgba(59,130,246,0.5)] transition-all duration-500">
                        <i class="fa-solid ${item.icon} text-blue-400 text-sm"></i>
                    </div>

                    <!-- Left Side (Desktop) -->
                    <div class="w-full md:w-[45%] pl-12 md:pl-0 md:pr-8 mb-6 md:mb-0 order-2 md:order-1 ${isEven ? 'md:text-right' : ''}">
                        ${isEven ? renderContent(item, true) : renderImage(item)}
                    </div>

                    <!-- Right Side (Desktop) -->
                    <div class="w-full md:w-[45%] pl-12 md:pl-8 order-3">
                        ${isEven ? renderImage(item) : renderContent(item, false)}
                    </div>
                </div>
                `;
                container.insertAdjacentHTML('beforeend', html);
            });

            // Vẽ lại timeline ngay sau khi render DOM
            requestAnimationFrame(drawTimeline);
        }

        function renderContent(item, alignRight = false) {
            const isLong = item.desc && item.desc.length > 150;
            return `
                <div class="glass-card p-6 rounded-2xl hover:-translate-y-1 transition-all duration-300 ${alignRight ? 'border-r-4' : 'border-l-4'} border-blue-500">
                    <span class="inline-block px-3 py-1 rounded-full bg-blue-500/10 text-blue-400 text-xs font-bold mb-3 border border-blue-500/20">${item.date}</span>
                    <h3 class="text-xl font-bold text-white mb-2">${item.title}</h3>
                    <p class="text-slate-400 text-sm leading-relaxed text-justify ${isLong ? 'line-clamp-3' : ''}">${item.desc}</p>
                    ${isLong ? `<button onclick="toggleDesc(this)" class="text-blue-400 text-xs font-bold mt-2 hover:text-blue-300 transition-colors focus:outline-none">Xem thêm <i class="fa-solid fa-chevron-down ml-1"></i></button>` : ''}
                </div>
            `;
        }

        function renderImage(item) {
            if (!item.image) return `<div class="hidden md:block"></div>`; // Placeholder nếu không có ảnh
            return `
                <div class="rounded-2xl overflow-hidden border border-white/10 shadow-2xl group-hover:shadow-blue-500/20 transition-all duration-500 h-48 md:h-64 relative">
                    <img src="${item.image}" onload="drawTimeline()" class="w-full h-full object-cover transform group-hover:scale-110 transition-transform duration-700" onerror="this.style.display='none'">
                </div>
            `;
        }

        // Debounce function để tối ưu hiệu năng
        let drawTimeout;

        function drawTimeline() {
            const container = document.getElementById('timeline-container');
            const icons = document.querySelectorAll('.timeline-icon');
            const basePath = document.getElementById('base-path');
            const activePath = document.getElementById('active-path');
            
            if (icons.length === 0) { basePath.setAttribute('d', ''); activePath.setAttribute('d', ''); return; }

            // Lấy tọa độ các icon
            const points = Array.from(icons).map(icon => {
                const rect = icon.getBoundingClientRect();
                const containerRect = container.getBoundingClientRect();
                return {
                    x: rect.left - containerRect.left + rect.width / 2,
                    y: rect.top - containerRect.top + rect.height / 2
                };
            });

            // Tạo đường dẫn SVG (Bezier Curve)
            let d = `M ${points[0].x} 0 L ${points[0].x} ${points[0].y}`; // Nối từ đỉnh xuống icon đầu

            for (let i = 0; i < points.length - 1; i++) {
                const p1 = points[i];
                const p2 = points[i+1];
                const midY = (p1.y + p2.y) / 2;
                // Vẽ đường cong chữ S mềm mại
                d += ` C ${p1.x} ${midY}, ${p2.x} ${midY}, ${p2.x} ${p2.y}`;
            }
            
            // Nối xuống đáy
            const last = points[points.length - 1];
            d += ` L ${last.x} ${container.offsetHeight}`;

            basePath.setAttribute('d', d);
            activePath.setAttribute('d', d);
            
            // Thiết lập độ dài để làm hiệu ứng vẽ
            const length = activePath.getTotalLength();
            pathLength = length;
            activePath.style.strokeDasharray = length;
            activePath.style.strokeDashoffset = length;
            
            // Cập nhật ngay lập tức vị trí hiển thị
            updateScrollPosition();
        }

        function updateScrollPosition() {
            const container = document.getElementById('timeline-container');
            const activePath = document.getElementById('active-path');
            if (!container || !activePath || pathLength === 0) return;
            
            const containerRect = container.getBoundingClientRect();
            const center = window.innerHeight / 2;
            
            // Tính toán vị trí cuộn tương đối với SVG
            let scrollDist = center - containerRect.top;
            if (scrollDist < 0) scrollDist = 0;
            if (scrollDist > pathLength) scrollDist = pathLength;

            activePath.style.strokeDashoffset = pathLength - scrollDist;

            // Active icon
            document.querySelectorAll('.timeline-item').forEach(item => {
                const icon = item.querySelector('.timeline-icon');
                const iconRect = icon.getBoundingClientRect();
                if (iconRect.top < center + 20) item.classList.add('active');
                else item.classList.remove('active');
            });
        }

        function initScrollSpy() {
            const container = document.getElementById('timeline-container');
            
            const onScroll = () => requestAnimationFrame(updateScrollPosition);
            
            const onResize = () => {
                clearTimeout(drawTimeout);
                drawTimeout = setTimeout(drawTimeline, 100);
            };
            
            window.addEventListener('scroll', onScroll, { passive: true });
            window.addEventListener('resize', onResize);
            
            // Vẽ lại khi tải xong ảnh hoặc thay đổi kích thước
            const resizeObserver = new ResizeObserver(() => requestAnimationFrame(drawTimeline));
            resizeObserver.observe(container);
            
            drawTimeline(); // Vẽ lần đầu
            updateScrollPosition(); // Init check

            // Register cleanup
            window.activitiesCleanup = () => {
                window.removeEventListener('scroll', onScroll);
                window.removeEventListener('resize', onResize);
                resizeObserver.disconnect();
            };
        }

        window.toggleDesc = (btn) => {
            const p = btn.previousElementSibling;
            if (p.classList.contains('line-clamp-3')) {
                p.classList.remove('line-clamp-3');
                btn.innerHTML = 'Thu gọn <i class="fa-solid fa-chevron-up ml-1"></i>';
            } else {
                p.classList.add('line-clamp-3');
                btn.innerHTML = 'Xem thêm <i class="fa-solid fa-chevron-down ml-1"></i>';
            }
            requestAnimationFrame(drawTimeline);
        };

        fetchActivities();
    }
    </script>
</body>
</html>
